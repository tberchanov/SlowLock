[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.3.21"
composeBom = "2026.08.00"
# KSP's version is Kotlin's plus its own patch: 2.3.11 is built for Kotlin 2.3.20+, and moving
# Kotlin without moving this in step is the usual way this build breaks (research R2).
ksp = "2.3.11"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coroutines = "1.11.0"
navigation = "2.10.0"
kotlinxSerialization = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Hilt. Without it there is no injection mechanism at all: every ViewModel goes back to being
# found by reflection through a SavedStateViewModelFactory, which is what @JvmOverloads and the
# AndroidViewModel constructors existed to work around (plan.md, Complexity Tracking).
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# hilt-lifecycle-viewmodel-compose, NOT hilt-navigation-compose: a destination already supplies
# LocalViewModelStoreOwner, so hiltViewModel() scopes to the back stack entry without it. The
# navigation artifact is needed only to reach a *parent* entry's store (research R3).
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
# Without it there is no navigation library, and screen arbitration falls back to a hand-written
# `when` over a sealed stage — prohibited outright by the constitution's Navigation constraint.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# Declared explicitly rather than inherited transitively, so the dispatcher qualifiers and the
# test dispatcher are pinned by this catalog rather than by whatever Compose happens to pull in.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# The runtime the generated route serializers call into. Declared rather than inherited from
# navigation-common for the reason above: pinned by this catalog, not by a navigation release.
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Generates the route serializers the type-safe navigation API needs; without it a @Serializable
# route does not compile. Its version tracks Kotlin exactly, as KSP's does above.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
